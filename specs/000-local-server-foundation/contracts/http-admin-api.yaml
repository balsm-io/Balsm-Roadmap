openapi: 3.1.0
info:
  title: Balsm Local Server — Admin API (Phase 0)
  version: 1.0.0
  description: |
    Admin-facing HTTP contract for the local Balsm server.

    Architecture: in Standalone (foundation) mode the surface is served by a
    single ASP.NET Core host (`Balsm.API`) that loads `Balsm.Supervisor` as an
    in-process library. Auth: all endpoints under `/api/v1/admin/*` are
    cookie-authenticated (`balsm_admin_session`) by `AdminAuthMiddleware`
    EXCEPT the whitelist (`/api/v1/admin/auth/setup`,
    `/api/v1/admin/auth/login`, `/api/v1/admin/auth/status`,
    `/api/v1/admin/auth/recovery/use`). Public endpoints
    (`/api/v1/health`, `/api/v1/server-info`) sit outside `/admin` and are
    open by design.

    Default bind: HTTP `:5050`, HTTPS `:5051` (per `Balsm.API/Program.cs`).
servers:
  - url: https://localhost:5051/api/v1
    description: Default Standalone-mode binding
tags:
  - { name: Lifecycle, description: "Balsm.API.Controllers.HealthController + new ServerInfoController" }
  - { name: FirstRun, description: "Balsm.Supervisor.Controllers.AuthController.Setup" }
  - { name: Auth, description: "Balsm.Supervisor.Controllers.AuthController.{Login,Logout,Status}" }
  - { name: Recovery, description: "Balsm.Supervisor.Controllers.AuthController.Recovery (new)" }
  - { name: Workspace, description: "Modules/Entity/Balsm.Entity.Api/Controllers/WorkspaceController (new)" }
  - { name: Entity, description: "Modules/Entity/Balsm.Entity.Api/Controllers/EntitiesController (new)" }
  - { name: Branch, description: "Modules/Entity/Balsm.Entity.Api/Controllers/BranchesController (new)" }
  - { name: EntityType, description: "Modules/Entity/Balsm.Entity.Api/Controllers/EntityTypesController (new)" }
  - { name: Mode, description: "Balsm.Supervisor.Controllers.ControlController.SwitchMode (extended)" }
  - { name: Backup, description: "Balsm.API.Endpoints / Modules/Entity → new BackupsController in Balsm.API/Controllers" }
  - { name: Restore, description: "same surface as Backup" }
  - { name: Audit, description: "new AuditController in Balsm.API/Controllers" }
  - { name: Status, description: "Balsm.Supervisor.Controllers.StatusController (existing, extended)" }
  - { name: Users, description: "Modules/Identity/Balsm.Identity.Api/Controllers/UsersController (extended)" }

paths:
  /health:
    get:
      tags: [Lifecycle]
      summary: Liveness + readiness probe (FR-009)
      description: |
        Existing `HealthController`; extended payload adds `ready` (false while
        `ReadinessGate` is held by migration / restore).
      security: []
      responses:
        '200':
          description: Up + ready
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '503':
          description: Up but not ready
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }

  /server-info:
    get:
      tags: [Lifecycle]
      summary: Server identity + version + cert fingerprint (FR-009)
      description: New endpoint in `Balsm.API.Controllers.ServerInfoController`; aggregates `CertificateService.GetFingerprint()` and the workspace name.
      security: []
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } }

  /admin/auth/setup:
    post:
      tags: [FirstRun]
      summary: First-run wizard completion (FR-004 + FR-018a)
      description: |
        Extends existing `AuthController.Setup`. Creates the admin (via
        `AdminAuthService.SetupAsync`), creates the singleton workspace (via
        MediatR `CreateWorkspaceCommand`), generates a one-time recovery code
        (new `RecoveryCodeService.GenerateAsync`), and returns the recovery
        code exactly once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstRunRequest' }
      responses:
        '201':
          description: Wizard completed; recovery code returned exactly once
          content: { application/json: { schema: { $ref: '#/components/schemas/FirstRunResponse' } } }
        '409': { description: Wizard already completed }
        '422': { description: Validation failure }

  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Admin login with rate-limit + lockout (FR-017)
      description: |
        Existing `AuthController.Login`. Now fronted by `RateLimitMiddleware`
        (new) which enforces the per-(email, source_ip) lockout in addition to
        the per-account counter already enforced by `AdminAuthService`. On
        success sets the `balsm_admin_session` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Logged in; session cookie set in Set-Cookie }
        '401': { description: Bad credentials }
        '423': { description: Locked (15-minute window) }

  /admin/auth/status:
    get:
      tags: [Auth]
      summary: Session status (existing whitelist endpoint)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }

  /admin/auth/logout:
    post:
      tags: [Auth]
      responses:
        '204': { description: Session invalidated; cookie cleared }

  /admin/auth/recovery/use:
    post:
      tags: [Recovery]
      summary: Use one-time recovery code to set new password + clear lockout (FR-018a)
      description: New endpoint; added to AdminAuthMiddleware public-path whitelist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryUseRequest' }
      responses:
        '204': { description: Password reset; recovery code retired; cookie set }
        '401': { description: Invalid or already-used code }

  /admin/auth/recovery/regenerate:
    post:
      tags: [Recovery]
      summary: Generate a fresh recovery code after a used one (FR-018a)
      responses:
        '200':
          description: Fresh code returned exactly once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryCode' }

  /admin/workspace:
    get:
      tags: [Workspace]
      summary: Read the single workspace (FR-005)
      description: New `WorkspaceController.Get` backed by `GetWorkspaceQuery`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
    post:
      tags: [Workspace]
      summary: Reject creation of a second workspace (FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreate' }
      responses:
        '409': { description: A workspace already exists }
    patch:
      tags: [Workspace]
      summary: Rename or update workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  /admin/entities:
    get:
      tags: [Entity]
      summary: List entities (paginated)
      parameters:
        - { in: query, name: include_inactive, schema: { type: boolean, default: false } }
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityPage' }
    post:
      tags: [Entity]
      summary: Create entity (FR-006)
      description: Backed by `CreateEntityCommand` returning `Result<EntityDto>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }

  /admin/entities/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Entity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entity' }
    patch:
      tags: [Entity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityUpdate' }
      responses:
        '200': { description: OK }

  /admin/entities/{id}/deactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Entity]
      summary: Soft-delete (FR-015)
      responses:
        '204': { description: Deactivated }

  /admin/entities/{id}/reactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Entity]
      summary: Restore a soft-deleted entity (inverse of deactivate, FR-015)
      responses:
        '200': { description: Reactivated }

  /admin/entities/{id}/branches:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Branch]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BranchPage' }
    post:
      tags: [Branch]
      summary: Create branch (FR-007)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchCreate' }
      responses:
        '201': { description: Created }

  /admin/branches/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Branch]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BranchUpdate' }
      responses:
        '200': { description: OK }
    delete:
      tags: [Branch]
      summary: Reject hard delete (FR-015)
      responses:
        '405':
          description: 'Hard delete forbidden; use the deactivate endpoint instead'

  /admin/branches/{id}/deactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Branch]
      responses:
        '204': { description: Deactivated }

  /admin/branches/{id}/reactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Branch]
      summary: Restore a soft-deleted branch (inverse of deactivate, FR-015)
      responses:
        '200': { description: Reactivated }

  /admin/entity-types:
    get:
      tags: [EntityType]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityTypePage' }
    post:
      tags: [EntityType]
      summary: Add an admin-defined entity type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntityTypeCreate' }
      responses:
        '201': { description: Created }

  /admin/mode:
    get:
      tags: [Mode]
      summary: Current operating mode (FR-013)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeState' }
    put:
      tags: [Mode]
      summary: Switch mode; service auto-restarts within ~10 seconds (FR-013)
      description: Existing `ControlController.SwitchMode` extended to support tunnel provider selection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeChange' }
      responses:
        '202':
          description: Mode change accepted; process will restart via the OS service manager
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeState' }

  /admin/status:
    get:
      tags: [Status]
      summary: Live process status (uptime, pid, mode, version, cert sha256, workspace name)
      description: Existing `StatusController.Get`; payload extended.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiStatus' }

  /admin/users/me:
    get:
      tags: [Users]
      summary: Read the current admin's mirror profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserMe' }
    patch:
      tags: [Users]
      summary: Update display name or locale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserMeUpdate' }
      responses:
        '200': { description: OK }

  /admin/backups:
    get:
      tags: [Backup]
      summary: List backups (reverse chronological, US4 AS#3, FR-011a)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupPage' }
    post:
      tags: [Backup]
      summary: Trigger on-demand backup (FR-011)
      responses:
        '202':
          description: Backup started; poll `GET /admin/backups` until status flips
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupFile' }

  /admin/backups/schedule:
    get:
      tags: [Backup]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
    put:
      tags: [Backup]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupSchedule' }
      responses:
        '200': { description: Updated }

  /admin/backups/{id}/restore:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Restore]
      summary: Restore from backup (FR-011b)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreConfirm' }
      responses:
        '202': { description: Restore started; non-health endpoints return 503 until completion }
        '409': { description: Another restore already in progress }

  /admin/audit/logs:
    get:
      tags: [Audit]
      summary: Query audit log (FR-016)
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to,   schema: { type: string, format: date-time } }
        - { in: query, name: module, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }

  /admin/audit/retention:
    get:
      tags: [Audit]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditRetention' }
    put:
      tags: [Audit]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditRetention' }
      responses:
        '200': { description: Updated }

  /admin/audit/archives:
    get:
      tags: [Audit]
      summary: List exported JSONL archives (FR-016a)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditArchivePage' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: balsm_admin_session
  security:
    - cookieAuth: []
  schemas:
    Health:
      type: object
      required: [status, ready, version, uptime_seconds]
      properties:
        status: { type: string, enum: [up, down] }
        ready: { type: boolean }
        version: { type: string }
        uptime_seconds: { type: integer }
        not_ready_reason: { type: string, nullable: true, description: "When ready=false, one of: migration, restore" }

    ServerInfo:
      type: object
      required: [version, mode, workspace_name, certificate_sha256, uptime_seconds]
      properties:
        version: { type: string }
        mode: { type: string, enum: [Standalone, Network, Public] }
        workspace_name: { type: string }
        certificate_sha256: { type: string }
        uptime_seconds: { type: integer }

    ApiStatus:
      description: Matches `Balsm.Supervisor.Models.ApiStatusResponse`.
      type: object
      properties:
        is_running: { type: boolean }
        pid: { type: integer }
        started_at: { type: string, format: date-time }
        uptime: { type: string }
        mode: { type: string }
        version: { type: string }
        certificate_sha256: { type: string }
        workspace_name: { type: string }

    AuthStatus:
      type: object
      properties:
        setup_complete: { type: boolean }
        authenticated: { type: boolean }
        admin_email: { type: string, nullable: true }

    FirstRunRequest:
      type: object
      required: [admin_email, admin_password, admin_display_name, workspace_name, workspace_slug, locale]
      properties:
        admin_email: { type: string, format: email }
        admin_password: { type: string, minLength: 12 }
        admin_display_name: { type: string }
        workspace_name: { type: string }
        workspace_slug: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        locale: { type: string, enum: [en, ar] }

    FirstRunResponse:
      type: object
      required: [admin_id, workspace_id, recovery_code]
      properties:
        admin_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        recovery_code: { type: string, description: Displayed exactly once; not recoverable from the server }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RecoveryUseRequest:
      type: object
      required: [email, recovery_code, new_password]
      properties:
        email: { type: string }
        recovery_code: { type: string }
        new_password: { type: string, minLength: 12 }

    RecoveryCode:
      type: object
      properties:
        recovery_code: { type: string }

    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [Active, Suspended] }
        locale_default: { type: string }

    WorkspaceCreate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }

    WorkspaceUpdate:
      type: object
      properties:
        name: { type: string }
        locale_default: { type: string, enum: [en, ar] }

    Entity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        registration_number: { type: string, nullable: true }
        is_active: { type: boolean }

    EntityCreate:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        registration_number: { type: string }

    EntityUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        registration_number: { type: string }

    EntityPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Entity' } }
        page_number: { type: integer }
        page_size: { type: integer }
        total_count: { type: integer }

    EntityType:
      type: object
      properties:
        code: { type: string }
        label_en: { type: string }
        label_ar: { type: string }
        is_seeded: { type: boolean }

    EntityTypeCreate:
      type: object
      required: [code, label_en, label_ar]
      properties:
        code: { type: string, pattern: '^[a-z0-9-]+$' }
        label_en: { type: string }
        label_ar: { type: string }

    EntityTypePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EntityType' } }

    Branch:
      type: object
      properties:
        id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        name: { type: string }
        address_line: { type: string, nullable: true }
        city: { type: string, nullable: true }
        governorate: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        is_active: { type: boolean }

    BranchCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address_line: { type: string }
        city: { type: string }
        governorate: { type: string }
        phone: { type: string }

    BranchUpdate:
      type: object
      properties:
        name: { type: string }
        address_line: { type: string }
        city: { type: string }
        governorate: { type: string }
        phone: { type: string }

    BranchPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        page_number: { type: integer }
        page_size: { type: integer }
        total_count: { type: integer }

    ModeState:
      type: object
      properties:
        mode: { type: string, enum: [Standalone, Network, Public] }
        mdns_active: { type: boolean }
        tunnel_provider: { type: string, nullable: true }

    ModeChange:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [Standalone, Network, Public] }
        tunnel_provider: { type: string }

    AdminUserMe:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { type: string }
        locale: { type: string, enum: [en, ar] }
        last_login_at: { type: string, format: date-time, nullable: true }

    AdminUserMeUpdate:
      type: object
      properties:
        display_name: { type: string }
        locale: { type: string, enum: [en, ar] }

    BackupFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        size_bytes: { type: integer }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
        trigger: { type: string, enum: [Manual, Scheduled, PreRestore] }
        status: { type: string, enum: [OK, Failed, Pruned] }

    BackupPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/BackupFile' } }
        page_number: { type: integer }
        page_size: { type: integer }
        total_count: { type: integer }

    BackupSchedule:
      type: object
      properties:
        cron: { type: string }
        retention_count: { type: integer, minimum: 1 }

    RestoreConfirm:
      type: object
      required: [confirm_phrase]
      properties:
        confirm_phrase: { type: string, description: 'Client must echo "RESTORE" to proceed' }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        source_ip: { type: string, nullable: true }
        module: { type: string }
        action: { type: string }
        target_type: { type: string, nullable: true }
        target_id: { type: string, nullable: true }
        details: { type: object }
        correlation_id: { type: string, nullable: true }

    AuditPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page_number: { type: integer }
        page_size: { type: integer }
        total_count: { type: integer }

    AuditRetention:
      type: object
      properties:
        retention_years: { type: integer, minimum: 1, maximum: 10 }

    AuditArchive:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        rows_exported: { type: integer }
        earliest_row_at: { type: string, format: date-time }
        latest_row_at: { type: string, format: date-time }
        sha256: { type: string }
        created_at: { type: string, format: date-time }

    AuditArchivePage:
      type: object
      properties:
